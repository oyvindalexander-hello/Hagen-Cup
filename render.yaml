services:
  - type: web
    name: hagen-cup
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: RESET_KEY
        generateValue: true
    disk:
      name: hagen-cup-data
      mountPath: /var/data
      sizeGB: 1
